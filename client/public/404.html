<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Adeel Raza | Portfolio</title>
    <script type="text/javascript">
      // SPA Page Protect Redirect Trick
      // Takes the current URL path that failed and appends it as a query parameter
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') + '/?p=' + l.pathname.slice(1).replace(/&/g, '~and~') + l.search.replace(/&/g, '~and~') + l.hash);
    </script>
  </head>
  <body>
  </body>
</html>
