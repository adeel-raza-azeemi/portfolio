<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Adeel Raza | Portfolio</title>
  <script>
    var l = window.location;
    l.replace(
      l.protocol + '//' +
      l.hostname +
      (l.port ? ':' + l.port : '') +
      '/?/' +
      l.pathname.slice(1)
        .replace(/&/g, '~and~')
        .replace(/\?/g, '~and~') +
      l.search +
      l.hash
    );
  </script>
</head>
